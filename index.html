<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Operation Rising Water</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#eaf0f3;--surface:#fff;--surface2:#f3f7f9;--ink:#10222b;--muted:#566a75;--line:#cbd8de;--accent:#b45309;--accent-ink:#fff;--water:#0e7490;--good:#15803d;--bad:#c62828;
--display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;--body:'IBM Plex Sans',system-ui,Arial,sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#09151b;--surface:#102129;--surface2:#162c36;--ink:#e5eef1;--muted:#90a7b1;--line:#244552;--accent:#f5a524;--accent-ink:#1a1200;--water:#38bdf8;--good:#4ade80;--bad:#ff6b6b;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);padding:0 16px 56px}
.wrap{max-width:860px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;line-height:1.1}
h1{font-size:44px}h2{font-size:30px;margin-bottom:10px}h3{font-size:21px;margin-bottom:6px}
.eyebrow{font:500 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0;margin-bottom:18px}
.bar .wrap{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font:700 22px var(--display);letter-spacing:.03em}.brand span{color:var(--accent)}
.sp{flex:1}
.pill{font:500 13px var(--mono);border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px;white-space:nowrap}
.timer{font:500 20px var(--mono)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin-bottom:14px}
.btn{font:600 17px var(--body);background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:12px 22px;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--water);outline-offset:2px}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:9px 11px}
textarea{min-height:70px;resize:vertical}
label.f{display:block;font-weight:600;margin:14px 0 4px}
.hint{color:var(--muted);font-size:14px}
.tl{display:grid;grid-template-columns:64px 1fr;gap:8px 12px;margin:0;padding:0;list-style:none}
.tl .t{font:500 13px var(--mono);color:var(--water);padding-top:3px}
.menu{display:grid;gap:7px}
.opt{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:11px 13px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);cursor:pointer}
.opt.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.opt input[type=checkbox]{margin-top:3px;width:20px;height:20px}
.cost{font:500 14px var(--mono);white-space:nowrap}
.rp{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.rp b{font:700 38px var(--display)}.over{color:var(--bad)}
.cq{border-left:4px solid var(--line);padding:8px 12px;margin:8px 0;background:var(--surface2);border-radius:0 6px 6px 0}
.cq.bad{border-left-color:var(--bad)}.cq.good{border-left-color:var(--good)}.cq.mid{border-left-color:var(--accent)}.cq.mid .k{color:var(--accent)}
.cq .k{font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase}
.cq.bad .k{color:var(--bad)}.cq.good .k{color:var(--good)}
.chaos{border:2px dashed var(--accent);border-radius:8px;padding:12px 16px;margin:14px 0}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.big{font:700 64px var(--display);line-height:1}
.steps{counter-reset:s;padding:0;list-style:none}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:8px;margin:8px 0}
.steps li::before{content:counter(s);font:700 24px var(--display);color:var(--accent)}
@media print{.bar .btn,.noprint{display:none!important}body{background:#fff;color:#000}.card{break-inside:avoid}}
.role{border:1px solid var(--line);border-radius:8px;background:var(--surface2);padding:9px 12px;margin:8px 0}
.prof{margin:8px 0 0;font-size:14px}.prof dt{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:7px}.prof dd{margin:1px 0 0}
.tbar{height:6px;background:var(--line);margin:-18px 0 14px}.tbar i{display:block;height:100%;background:var(--water);transition:width .5s linear}.tbar i.low{background:var(--bad)}
.timer{font:700 26px var(--mono)}
.cost{color:var(--muted);font-size:12px;text-align:right;max-width:110px}
details summary{padding:2px 0}
</style><style>.chg{display:block;margin-top:4px;font-size:13.5px;line-height:1.35}.chg b{font-weight:700}.chg.up{color:var(--accent)}.chg.dn{color:var(--bad)}.chg.nt{color:var(--muted)}.chg.nw{display:inline-block;margin:0 6px 0 0;padding:1px 7px;border-radius:10px;background:var(--accent);color:#fff;font-size:12px;font-weight:700}.opt.isnew{border-style:dashed}.newopts{margin-top:16px;padding:12px 14px;border:2px dashed var(--accent);border-radius:8px}.k2{font-weight:700;margin:12px 0 4px}.chl{margin:0;padding-left:20px}.chl li{margin:6px 0}</style><meta name="author" content="Ayham Fattoum"><meta name="copyright" content="© 2026 Ayham Fattoum. All rights reserved."><style>.copy{text-align:center;color:var(--muted);font-size:12px;padding:22px 16px 30px}@media print{.copy{padding-top:8px}}</style></head><body>
<div id="app"></div><div class="copy">© 2026 Ayham Fattoum. All rights reserved. Operation Rising Water is an original teaching exercise.</div>
<script>
const DATA = {"TITLE": "Operation Rising Water", "CITY": "Northbridge", "SCENARIO": "Northbridge is a fictional city of 280,000 people on the River Wend. After three days of heavy rain, a severe flood is on its way. Your team is the Strategic Co-ordinating Group (Gold). Each of you plays one agency. Over six rounds of five minutes you decide what to do before the flood, during it, and in the months after.", "ROLES": [{"name": "Emergency services", "summary": "Emergency services commander, speaking for police, fire and rescue, and ambulance. You lead on rescue, safety and keeping order.", "priorities": "Save life first. Rescue people from the flood and from care homes. Protect people and property. Keep roads, bridges and scenes safe and keep order.", "cares": "A clear lead and fast decisions. The safety of your crews and officers. Control of who goes where.", "ethics": "Your duty is to protect life, and the law limits what you can force people to do. You are accountable to the public, so every use of power must be justified. Your services answer to different chiefs, so you must speak for all of them.", "tension": "You may find volunteers and crowds a safety risk, and the council and the Red Cross slow, when you want quick, firm decisions."}, {"name": "Council", "summary": "The local council. You run the flood plan, rest centres, housing and, later, recovery.", "priorities": "Keep essential services running. Shelter and care for vulnerable people. Rebuild the city and its economy.", "cares": "Your legal duties to every resident. Fairness and public money. Local politicians and a public that blames you.", "ethics": "You owe the same duty to all residents and you must account for every pound. You are tempted to promise quick recovery and to protect the council's reputation. Honesty about delays is part of your duty.", "tension": "You may clash with the police over speed and force, and with the Red Cross over who pays, who is in charge and who gets help first."}, {"name": "British Red Cross", "summary": "The British Red Cross. You bring volunteers, rest centres and a link to communities.", "priorities": "People's immediate needs, their dignity and wellbeing. Reach people that nobody else is reaching.", "cares": "Consent and dignity. The safety of your volunteers. The trust of the communities you serve.", "ethics": "Your principles are humanity, impartiality, neutrality, independence and voluntary service. You help according to need, and you do not take orders that compromise them. You are not a statutory responder, so you must make sure you are heard.", "tension": "You may clash with the police over control and sharing personal details, and with the council if you feel used as cheap capacity."}], "INTRO": [["The place", "Northbridge is a fictional city of 280,000 people on the River Wend. Its north estate has 1,400 homes and three care homes, and many residents are older. The city's water treatment works and the Castle Meads electricity substation both sit close to the river."], ["What happened last time", "In November 2015 the Wend flooded 1,900 homes. The official review was blunt. Police and the council gave different warnings. Volunteers with boats worked alone and two had to be rescued. Families waited months for somewhere to live, and were passed between insurers, the council and builders. Many residents said they had been managed, not helped."], ["Why there is tension now", "The flood plan was rewritten in 2018, but it has never been tested in a real flood. The agencies still remember 2015 differently. Police feel the council was slow. The council felt it took the blame for decisions that were not its alone. The Red Cross felt it was called late and used as spare capacity. Nobody wants to repeat 2015, but each agency has its own idea of what went wrong."], ["Who you are and why you are meeting", "You are the Strategic Co-ordinating Group, called Gold: three people who speak for the police, the council and the British Red Cross. You are meeting at the city's multi-agency co-ordination centre on Friday at midday because the Environment Agency has issued flood alerts for the Wend and a severe flood is possible overnight. Police and the council are local responders with legal duties to work together. The Red Cross is a voluntary organisation that brings volunteers and community links, but it has no legal duty, so it must make sure it is heard."], ["What you have to do", "Over six rounds you decide what to do before the flood, during it and in the months after. In each round you select every decision your team makes. You can choose one action or many, and the trade-offs are yours: too little leaves gaps, and too much stretches everyone and causes confusion. Your agencies will not always agree. You have up to five minutes for each round, and new information arrives during it. You can submit early, but you will miss what is still to come. At the end you get a score and a report on what each decision led to."]], "ROUNDS": [{"n": 1, "name": "The warning hours", "when": "Friday 12:00 to 18:00", "phase": "Response (before the flood)", "minutes": 5, "brief": {"Council": "You hold the flood plan and the list of care homes. The plan was last updated in 2018 and covers only 20,000 people. You do not yet know whether the flood will reach the north estate.", "British Red Cross": "Your volunteers are on stand-by, but nobody has asked you to do anything yet. You do not know which rest centres to open or where to send people.", "Emergency services": "Your police, fire and ambulance crews are already busy with the storm. If the flood comes they will be doing rescues, and they cannot also knock on every door later."}, "situation": [["12:00", "Three days of heavy rain. The Environment Agency has issued flood alerts for the River Wend. A severe flood is possible overnight. About 6,200 homes are at risk."], ["14:00", "The north estate has 1,400 homes and three care homes. Many residents are older people. Some local people say they will wait and see."], ["15:30", "The council flood plan was last updated in 2018. The water plan covers 20,000 people. Police and the council use different words in their warnings on social media."]], "menu": [["Brief all agencies now and agree who leads on what", 1, "Joint", 3, 1, "Agreeing roles before the flood is the cheapest form of co-ordination. Pitt (2008) found that unclear roles and no single lead slowed the 2007 response."], ["Agree one set of warning messages and use it on every channel", 1, "Joint", 3, 1, "One voice matters before the flood as much as during it. One shared message is a basic principle of joint working (JESIP)."], ["Door-to-door warnings for the north estate and the care homes", 2, "Emergency services", 3, 0, "Early action for the most vulnerable people is what triggers are for (Fattoum, 2023). A knock on the door in daylight is easier than a rescue in the dark."], ["Tell the care homes to prepare to move residents", 1, "Council", 2, 0, "Preparing early gives care homes time to call families, arrange transport and pack medicines. It does not move anyone yet, so it is cheap and reversible."], ["Pre-position boats, high-water vehicles and rescue teams", 2, "Emergency services", 2, 0, "Rescue teams in place before the water arrives save time later. The risk is spreading them too thinly before you know where the water goes."], ["Check the flood plan and the water and power plans, and fix the gaps", 2, "Council", 2, 0, "The plan covers 20,000 people and 140,000 may lose water. Finding that gap now is better than finding it at 22:30."], ["Ask the British Red Cross to prepare rest centres and volunteer teams", 1, "British Red Cross", 2, 1, "The voluntary sector was part of the 2007 response and Pitt asked for it to be built into plans. Asking early lets the British Red Cross open on time."], ["Wait for the Severe Flood Warning to be confirmed before acting", 0, "Joint", 0, 0, "Waiting for certainty uses up the hours you have. Early action triggered by a forecast, not by proof, is the lesson of Fattoum (2023), Figure 4.2."], ["Tell the media the situation is under control", 0, "Council", 0, 0, "False reassurance is risky. When the flood arrives people remember it, and later warnings are ignored. Honest, clear risk messages work better."], ["Start recovery planning now", 0, "Council", 1, 0, "Coppola says recovery starts during response, so this is not wrong. But in the warning hours, life safety and warnings come first."]], "conseq": [{"item": 0, "title": "Who leads?", "not_text": "Friday 21:00. At the first meeting nobody is sure who leads. Police ask the council for the care home list. The council thought the health service had it. It takes two hours."}, {"item": 1, "title": "Three warnings", "not_text": "Friday 20:00. Three versions of the warning are circulating. Phone lines are jammed with people asking which one is right."}, {"item": 2, "title": "Locked doors", "not_text": "Saturday 01:00. Residents who did not get a knock on the door stayed at home. Rescue teams are now needed on the north estate, in the dark."}, {"item": 3, "title": "No warning for the care homes", "not_text": "Saturday 01:00. The care homes had no warning that they might need to move. Staff say they would have called families and arranged transport earlier."}, {"item": 6, "title": "Rest centres open late", "not_text": "Saturday 02:00. The first 300 evacuees queue in the rain at a locked leisure centre. Volunteers say nobody told them where to go."}, {"item": 7, "title": "Hours lost", "yes_text": "Friday 21:00. You waited for the Severe Flood Warning. It came, but the roads out of the north estate had already started to flood and the first hours were lost.", "yes_bad": true}, {"item": 8, "title": "Under control?", "yes_text": "Saturday 03:00. When the north estate floods, people repeat 'under control' to reporters with bitter jokes. Trust falls and later warnings are ignored.", "yes_bad": true}], "want": {"Council": "You want to check and fix the plan first, and to get the care homes ready to move residents. You want to be sure of the facts before you frighten people.", "British Red Cross": "You want to be asked now to prepare rest centres and volunteer teams. You want people told where they can go and who will help them.", "Emergency services": "You want people on the north estate and in the care homes warned and told to leave early. You want boats and rescue teams in place before the water arrives."}, "resist": {"Council": "You will argue against moving everyone early. It costs money, and a false alarm makes people ignore the next warning.", "British Red Cross": "You will argue against forcing people to leave. People leave more willingly when they have a safe place to go and some choice.", "Emergency services": "You will argue against spending crew and officer time on long meetings and paperwork now."}, "injects": [{"id": "r1a", "has": [], "lacks": [1], "title": "Different words", "time": "15:45", "text": "Police have posted 'evacuate now' on social media. The council post says 'be ready'. Residents are confused and the phone lines are jammed.", "cause": "Your team has not yet agreed one set of warning messages.", "change": {"1": {"must": true, "tag": "Two different messages are already out."}, "8": {"tag": "This would make the confusion worse, not better."}, "7": {"tag": "Waiting leaves two conflicting messages in place."}}, "add": [["Correct the conflicting posts and publish one wording on one channel now", 1, "Joint", 3, 1, "Two different messages were already out. One wording, one channel and a plain instruction is the quickest way to stop the confusion (one voice)."], ["Open one shared phone line for residents, staffed by all three agencies", 1, "Council", 2, 1, "A single line stops people being passed between agencies and takes pressure off the jammed phone lines."]], "model": "Agree one wording and one channel straight away, correct the conflicting posts, and say plainly what people should do."}, {"id": "r1b", "has": [1], "lacks": [0], "title": "Everyone leading", "time": "15:45", "text": "Police and council teams are both knocking on doors on the north estate, some of them twice. The Red Cross volunteers do not know who to report to.", "cause": "Your team agreed a message but has not yet agreed who leads on what.", "change": {"0": {"must": true, "tag": "Teams are already overlapping and volunteers have no one to report to."}, "9": {"tag": "This can wait. First sort out who leads on the ground.", "g": 0}}, "add": [["Name one lead for each task and write it down for every team", 1, "Joint", 3, 1, "Overlapping teams show that nobody was in charge of each task. A named lead for each task fixes this."], ["Hold a short call with all three agencies every hour", 1, "Joint", 2, 1, "A regular short call lets agencies share what they have done and keep each other informed."]], "model": "Name one lead for each task and hold regular short calls."}, {"id": "r1c", "has": [0, 1], "lacks": [], "title": "Wait and see", "time": "15:45", "text": "A well-known local councillor tells a radio show that the flood will 'miss the north estate' and that people should not panic. Doorstep warnings are being ignored.", "cause": "Your team has agreed who leads and what to say. Now the message is being challenged.", "change": {"2": {"must": true, "tag": "Some people will only move if someone tells them in person."}, "5": {"g": 1, "tag": "This matters, but people must be reached first."}}, "add": [["Ask a trusted local voice to repeat the Environment Agency forecast, using the same words as the agencies", 1, "Council", 3, 1, "People listen to people they trust. A local voice repeating the agreed forecast counters the radio message without creating a second version."], ["Add extra door-to-door teams for the streets nearest the river", 1, "Emergency services", 2, 0, "The people closest to the river are in the most danger and the most likely to have heard the radio message."]], "model": "Correct it quickly, with the Environment Agency forecast and a trusted local voice. Keep the message the same across agencies."}]}, {"n": 2, "name": "The first 12 hours", "when": "Friday 18:00 to Saturday 06:00", "phase": "Response", "minutes": 5, "brief": {"Council": "Your staff are at home and the council offices may flood. You must find rest centres, transport and water for 140,000 people who may lose their mains supply.", "British Red Cross": "About 200 local people with boats have turned up at the river bridge. Nobody has asked them to come. Your own volunteers want to help too.", "Emergency services": "It is night. Your teams are on the north estate. They can see which streets are flooding and who is in danger, and you have no spare crews or officers."}, "situation": [["18:00", "Severe flood warnings are issued. Peak is forecast for 03:00. About 6,200 homes are at risk, including three care homes. Two agencies have issued different warnings for the north estate."], ["22:30", "The Wend Valley water treatment works floods and shuts down. 140,000 people will lose mains water within 12 hours. The water plan assumes 10 litres a day for 20,000 people."], ["01:00", "The Castle Meads substation is threatened. If it goes, 40,000 homes lose power, including pumping stations."], ["02:00", "Around 200 people with their own boats gather at the river bridge. Social media is calling for more. Nobody has asked them to come."]], "menu": [["Convene Gold now and open the multi-agency centre", 1, "Emergency services", 3, 1, "Convening the Strategic Co-ordinating Group (Gold) early, as a precaution, is what Pitt (2008, Rec. 43) recommends where there is a risk of serious flooding. Without a Gold group, nobody owns the public message."], ["Issue one joint public warning, one voice, all channels", 1, "Joint", 3, 1, "One joint warning with one voice. One voice is a basic principle of joint working (JESIP), and here two agencies were already giving different warnings for the north estate."], ["Boats and rescue teams to the north estate", 3, "Emergency services", 3, 0, "Saving lives comes first. The north estate is at the most immediate risk, and rescue teams are hard to find later."], ["Evacuate the three care homes", 2, "Council", 3, 0, "Care home residents are among the most vulnerable. Moving them before the water arrives avoids the harm shown in the consequence card."], ["Open rest centres and transport for evacuees", 2, "British Red Cross", 2, 0, "Evacuated people need shelter and transport, or the evacuation is only half done. It follows from deciding who to move."], ["Bottled water plan and distribution points for 140,000 people", 3, "Council", 2, 0, "140,000 people will lose mains water. Pitt (2008, Rec. 40) recommended raising the minimum amount of water provided in an emergency, to reflect a long loss of supply. Important, but it can start after the life-saving actions."], ["Temporary defences at Castle Meads substation", 2, "Council", 2, 0, "Protecting the substation protects the pumping stations and power for about 40,000 homes. Losing it would make everything else harder."], ["Request military support", 1, "Emergency services", 0, 0, "Premature. Military help is a last resort, requested for a defined task. Nothing yet shows that civil agencies cannot cope, so the request uses resources without a clear job."], ["Set up a volunteer co-ordination point", 1, "British Red Cross", 2, 1, "The 200 boat owners are an emergent group (Dynes, Type IV). A co-ordination point uses their help safely instead of ignoring them or ordering them about."], ["Start a small recovery planning cell from hour one", 1, "Council", 1, 0, "Coppola says short-term recovery starts during response, and Fattoum says to plan renewal early. A small cell is useful, but it does not save lives in the first 12 hours."]], "conseq": [{"item": 0, "title": "Two voices", "not_text": "Saturday. At 03:00 police and the council gave different instructions on the north estate. One care home was evacuated twice. Trust in the response is low and you spend time on repair.", "not_rp": -1, "yes_text": null, "yes_rp": 0}, {"item": 1, "title": "Rumours", "not_text": "Saturday. A rumour that the flood wall has failed sent 3,000 people to rest centres that were already full. Public anger is rising and staff are needed to calm crowds.", "not_rp": -1, "yes_text": null, "yes_rp": 0}, {"item": 3, "title": "Care homes", "not_text": "Saturday. Several care home residents needed hospital treatment after a night in cold water. The press asks why they were not moved. Health services are stretched.", "not_rp": -1, "yes_text": null, "yes_rp": 0}, {"item": 5, "title": "A thirsty city", "not_text": "Saturday. Shops have run out of water and people are fighting over what is left. Vulnerable people have had no clean water for 12 hours.", "not_rp": -1, "yes_text": null, "yes_rp": 0}, {"item": 8, "title": "Boats on their own", "not_text": "Saturday. The volunteer boat owners worked alone. Two boats capsized and needed rescue. Some volunteers entered unsafe homes. Volunteer groups now refuse to work with the council.", "not_rp": -1, "yes_text": "Saturday. The volunteer co-ordination point kept a list of 300 trained helpers. They are ready to help clear homes safely.", "yes_rp": 0}, {"item": 9, "title": "A head start", "not_text": null, "not_rp": 0, "yes_text": "Saturday. The recovery cell already has a list of 400 vulnerable households and a draft housing plan. You save time.", "yes_rp": 1}, {"item": 7, "title": "Whose troops?", "not_text": null, "not_rp": 0, "yes_text": "Saturday. Troops arrived without a defined task. They cleared some roads, but the army liaison officer and Silver used the word 'tactical' to mean different things for two days, and the north estate waited. Military help works when a clear task is agreed first.", "yes_rp": 0, "yes_bad": true}, {"item": 6, "title": "The substation held", "not_text": null, "not_rp": 0, "yes_text": "Saturday. The substation held and the pumping stations and power for about 40,000 homes stayed on. This kept hospitals and water treatment running.", "yes_rp": 0}], "want": {"Council": "You want the care homes evacuated, rest centres and transport ready, and a plan for bottled water. You also want the power substation protected.", "British Red Cross": "You want a volunteer point where helpers are listed, given safety advice and sent to tasks. You want rest centres opened and run by your volunteers.", "Emergency services": "You want rescue boats and teams sent to the north estate now, and one clear command so that orders do not conflict. You will ask for military help if you run out of people."}, "resist": {"Council": "You will argue against spending the night on public messages or recovery plans while people are still in danger.", "British Red Cross": "You will argue against turning helpers away. They are neighbours who know the streets, and refusing them damages trust.", "Emergency services": "You will argue against volunteers going into the water or into unsafe homes. Untrained helpers can become new casualties."}, "injects": [{"id": "r2a", "has": [], "lacks": [0], "title": "Silver, not Gold", "time": "23:30", "text": "The duty officer assumes Gold has been convened. Nobody has called it. Public information has gone quiet and agencies are acting on their own.", "cause": "Your team has not yet convened Gold.", "change": {"0": {"must": true, "tag": "Nobody has called Gold, and everyone thinks someone has."}, "1": {"must": true, "tag": "Public information has stopped."}, "6": {"g": 1, "tag": "Still useful, but it needs a command structure to organise it."}}, "add": [["Brief the Silver commanders and agree who they report to", 1, "Emergency services", 2, 1, "Silver commanders were working without direction. A briefing links them to the strategic group."], ["Restart public information with one voice and a fixed update time", 1, "Joint", 3, 1, "With no Gold, nobody owned the public message. A single voice with fixed times rebuilds trust."]], "model": "Convene Gold now, brief Silver, and restart public information through one voice."}, {"id": "r2b", "has": [0, 3], "lacks": [], "title": "Two leaders", "time": "23:30", "text": "Police and the health service each say they lead on the care home evacuation. Two sets of instructions reach the care homes.", "cause": "Your team chose to evacuate the care homes, and more than one agency is now involved.", "change": {"3": {"must": true, "tag": "Two sets of instructions are reaching the homes."}, "0": {"tag": "Gold can settle who leads."}}, "add": [["Agree one lead for the care home evacuation and send one set of instructions", 1, "Joint", 3, 1, "Two leaders gave two sets of instructions. The lead agency is usually the main source of co-ordination on the ground, so one has to be agreed."], ["Send a named liaison officer to each care home", 1, "Council", 2, 1, "A named person on site is a reliable point of contact for staff and relatives."]], "model": "Agree one lead for the care home evacuation straight away and send one set of instructions."}, {"id": "r2c", "has": [0], "lacks": [3], "title": "Boats on the water", "time": "23:30", "text": "Some of the 200 boat owners have set off on their own towards the north estate. One boat has hit debris and its crew need rescuing.", "cause": "Your team has convened Gold but has not yet moved the care homes. People are still at risk and volunteers are acting alone.", "change": {"8": {"must": true, "tag": "Boat owners are already on the water."}, "7": {"tag": "Still not needed. The problem is co-ordination, not a shortage of rescuers."}, "2": {"tag": "Rescue teams may now also be needed for the volunteers."}, "3": {"must": true, "tag": "The care homes have not been moved and the water is rising."}}, "add": [["Send a rescue team to the boat crew in trouble", 1, "Emergency services", 2, 0, "People are now at risk who were not an hour ago. They have to be reached first."], ["Give boat owners a safe job: ferrying supplies and passing messages, under a rescue team lead", 1, "British Red Cross", 3, 1, "Emergent volunteers can add capacity if they are given a role and a lead, instead of being ignored or ordered about."]], "model": "Bring the boat owners into a co-ordination point with a safe task, and do not forget the people who are most at risk."}]}, {"n": 3, "name": "Keeping the response going", "when": "Saturday 06:00 to Sunday 18:00", "phase": "Response (sustaining)", "minutes": 5, "brief": {"Council": "900 people are in three rest centres and two are nearly full. Your own staff are flooded. The water treatment works is still off.", "British Red Cross": "Your volunteers run the rest centres. They see people who are tired, frightened and short of medicines and information. Donations are starting to arrive in lorries.", "Emergency services": "Your crews and officers have worked all night and many have not slept. Rumours of looting are spreading and people are asking for patrols."}, "situation": [["Sat 06:00", "The water peaked at 03:00 and is still high. 3,100 people have left their homes. Rescue teams have worked 12 hours without a break."], ["Sat 14:00", "900 people are in three rest centres and two are nearly full. Several evacuees need regular medicines or treatment. Some care home residents are still in hospital."], ["Sun 06:00", "Power is back in most of the city. The water treatment works is still off and bottled water is running low."], ["Sun 12:00", "Responders have worked 30 hours. Some are making mistakes. Nobody has planned the rota for the next 48 hours."]], "menu": [["Set a shift rota and a rest plan for responders for the next 48 hours", 1, "Joint", 2, 0, "Tired responders make mistakes. Bigley and Roberts (2001) show that organisations in a crisis need reserves and a flexible structure, not only effort."], ["Open more rest centres and share the care duties with the British Red Cross", 2, "British Red Cross", 3, 1, "Shelter is a council duty and the British Red Cross can run it. Sharing the work between them avoids overflowing centres and uses the voluntary sector as Pitt recommended."], ["Find and contact vulnerable residents, using care home, health and social care lists", 2, "Council", 3, 1, "Vulnerable people are the highest risk. Sharing lists between agencies finds those that any one agency would miss."], ["Give one public update at fixed times, with one phone line", 1, "Joint", 3, 1, "Predictable updates replace rumour. One voice is a basic principle of joint working (JESIP) and links to Weick on shared understanding."], ["Set up a donations point and say what is needed", 1, "British Red Cross", 2, 1, "Unrequested donations and helpers can arrive in great numbers (Dynes: convergence). A named point and a list of needs turns them into help."], ["Arrange safe water for care homes and dialysis patients first", 2, "Council", 3, 0, "Pitt (2008, Rec. 40) recommended raising the minimum amount of water provided in an emergency, to reflect a long loss of supply, and the most vulnerable are hit first."], ["Search every flooded street again", 2, "Emergency services", 2, 0, "Searching is the right thing to do while people may be missing. It is sound, but it uses tired teams and is less urgent than shelter and water now."], ["Send all evacuees home as soon as the water falls", 0, "Council", 0, 0, "Premature. Houses are wet, contaminated and without power. Coppola warns against rushing back to normal when the risk has not gone."], ["Start a street-by-street count of damaged homes", 1, "Council", 2, 0, "Recovery starts during response (Coppola). A list of flooded homes by address makes case work possible later."], ["Ask volunteers to stay away until they are trained", 1, "Emergency services", 1, 0, "Safety is real, but turning helpers away wastes help and trust. Dynes would say to co-ordinate emergent groups, not refuse them."]], "conseq": [{"item": 0, "title": "A tired crew", "not_text": "Monday. A tired driver crashes a rescue vehicle. Nobody is badly hurt, but two crews are out for the day."}, {"item": 1, "title": "Overflow", "not_text": "Monday. Two rest centres overflowed. Evacuees slept in corridors and the council was blamed. The British Red Cross says it was not asked to help until Sunday night."}, {"item": 2, "title": "Missed on oxygen", "not_text": "Monday. Two vulnerable residents on oxygen at home were found on day 3. Nobody knew they were there."}, {"item": 3, "title": "Rumours travel faster", "not_text": "Monday. Rumours spread faster than official news. Trust in the response is low and some residents will not follow advice."}, {"item": 4, "title": "Donations", "not_text": "Monday. Donations block the rest centres. Staff spend hours sorting clothes instead of helping people.", "yes_text": "Monday. The donations point is well organised and publishes a list of needs. Volunteers sort it in a day and the rest centres are stocked."}, {"item": 5, "title": "No safe water", "not_text": "Monday. Care homes and dialysis patients had no safe water for 24 hours. Two patients went to hospital."}, {"item": 7, "title": "Home to mud", "yes_text": "Monday. Families who went home found no power and mud-covered, contaminated houses. Some came back to the rest centres in the dark. Trust fell.", "yes_bad": true}, {"item": 8, "title": "A list of homes", "yes_text": "Monday. The street count gives the council a list of 5,100 flooded homes, by address. Case work can start on Tuesday."}, {"item": 9, "title": "Helpers on their own", "yes_text": "Monday. Volunteers were told to stay away. Many went anyway and worked alone, without safety advice. Two entered unsafe houses.", "yes_bad": true}], "want": {"Council": "You want vulnerable people found and given safe water first, and a count of flooded homes started. You also want evacuees home soon, to free the rest centres.", "British Red Cross": "You want more rest centres, an organised donations point, and one regular update at set times so people know what is happening.", "Emergency services": "You want to search the flooded streets again in case anyone is missing, and to patrol empty homes."}, "resist": {"Council": "You will argue against open-ended spending on extra services before you know how many people need them.", "British Red Cross": "You will argue against sending people home to wet, unsafe houses, and against sending volunteers away.", "Emergency services": "You will argue against giving crews and officers jobs that are not emergency work, such as running rest centres or sorting donations."}, "injects": [{"id": "r3a", "has": [], "lacks": [2], "title": "Missed on oxygen", "time": "Sat 20:00", "text": "The health service tells you that three people on home oxygen and two dialysis patients have not been contacted since Friday. One has called 999 from a flooded ground floor.", "cause": "Your team has not yet set out to find and contact vulnerable residents.", "change": {"2": {"must": true, "tag": "People on home oxygen and dialysis have not been reached."}, "5": {"must": true, "tag": "Dialysis patients need safe water."}, "6": {"g": 1, "tag": "Lower priority than reaching people who have not been contacted."}}, "add": [["Ask the health service for its list of people on home oxygen and dialysis, and call each one", 1, "Council", 3, 1, "Health records are the quickest way to find people who need medical equipment and may not be able to ask for help."], ["Send welfare teams to the homes of anyone you cannot reach by phone", 1, "British Red Cross", 2, 0, "Some people will not answer the phone. A visit is the only way to know they are safe."]], "model": "Use the health service lists, call everyone on them, and visit anyone you cannot reach."}, {"id": "r3b", "has": [2], "lacks": [4], "title": "Mountains of donations", "time": "Sat 20:00", "text": "Lorries of donated clothes and food arrive at the rest centres with nowhere to store them. Staff are spending hours sorting instead of helping people.", "cause": "Your team has not yet set up a place for donations.", "change": {"4": {"must": true, "tag": "Lorries are arriving and staff are being pulled away from care."}, "9": {"tag": "Volunteers could help with the donations if they are organised. Asking them all to stay away wastes them.", "g": 0}}, "add": [["Open one donations point away from the rest centres and publish a list of what is needed", 1, "British Red Cross", 3, 1, "A separate site keeps the rest centres clear. A list stops the wrong goods arriving."], ["Ask trained volunteers to run the sorting so staff can go back to caring for people", 1, "British Red Cross", 2, 1, "Volunteers can take on the sorting, freeing staff for people who need care."]], "model": "Open one donations point away from the rest centres, publish a list of what is needed, and ask volunteers to run it."}, {"id": "r3c", "has": [2, 4], "lacks": [], "title": "Looting rumours", "time": "Sat 20:00", "text": "Rumours of looting spread on social media. Some people refuse to leave their homes. Police are asked to patrol the south estate, which would take officers from the rescue effort.", "cause": "Your team has the main needs covered. Now a rumour is threatening to undo it.", "change": {"3": {"must": true, "tag": "Rumours are spreading faster than facts."}, "6": {"g": 1, "tag": "Lower priority now: police officers are needed elsewhere."}, "7": {"tag": "Sending people home now would leave homes empty and feed the rumours."}}, "add": [["Emergency services and council post facts on social media, including where belongings are safe", 1, "Emergency services", 3, 1, "A fact-based message from trusted sources stops a rumour from becoming a reason not to leave."], ["Agree a small number of patrols so rescue teams are not pulled away", 1, "Emergency services", 2, 1, "A visible but limited patrol reassures people without leaving the rescue effort short of staff."]], "model": "Give a clear, fact-based message and balance patrols with rescue."}]}, {"n": 4, "name": "The water goes down", "when": "Days 3 to 10", "phase": "Early recovery", "minutes": 5, "brief": {"Council": "You now lead recovery. About 15% of your staff are flooded, your offices are damaged, and the media keeps asking when life will be normal.", "British Red Cross": "Your volunteers are visiting flooded homes. Some families are being passed between insurers, the council and builders, and nobody is looking after them.", "Emergency services": "The water is going down. Streets are open again, people want to go home, and many contractors and volunteers are on site."}, "situation": [["Day 3", "The river falls. 5,100 homes are flooded. 900 people are in rest centres. 140,000 people still rely on bottled water, which will last about 12 more days."], ["Day 4", "The council offices are flooded. About 15% of council staff are flooded at home or cannot reach work."], ["Day 5", "About 40 contractors and insurance firms arrive, each working alone. Volunteers are clearing homes and some are unsafe."], ["Day 7", "A local politician says everyone must be back home within two weeks. The media asks: when will life be normal?"]], "menu": [["Set up a Recovery Co-ordinating Group chaired by the council", 1, "Council", 3, 1, "A Recovery Co-ordinating Group led by the council (Pitt, 26.15 and 26.16) avoids the 'five plans' problem, where each agency recovers on its own."], ["Single point of contact and case workers for flooded households", 3, "Joint", 3, 1, "A single point of contact answers the recovery gap and the secondary stress found by Whittle et al. (2010). Households were being passed between insurers, council and builders."], ["Temporary housing and hotel placements", 3, "Council", 3, 0, "The rest centres are closing and hundreds of households have nowhere to live. Housing is the most urgent recovery need."], ["Debris and strip-out plan with contractors and safety rules", 2, "Council", 2, 0, "Strip-out and debris clearance have to start, with safety rules, because contractors and volunteers working alone are already a risk."], ["Volunteer co-ordination with basic training", 1, "British Red Cross", 2, 1, "Volunteers are already clearing homes, some unsafely. Co-ordination with basic training keeps their help and reduces the risk."], ["Business helpline and small grants", 2, "Council", 1, 0, "Businesses matter, but within ten days households need housing and a clear route to help first. Business support fits Round 3 better."], ["Public message on a realistic recovery timeline", 1, "Council", 3, 0, "An honest timeline counters the pull to go back to normal, which Coppola calls the greatest obstacle in recovery. A promise of two weeks will be broken and trust will fall."], ["Mutual aid: request staff from neighbouring councils", 2, "Council", 2, 1, "Staff in about 15% of council posts are affected, and an established organisation can lose its own capacity (Dynes). Mutual aid, which Pitt found mostly ad hoc, needs planning."], ["Re-open schools on temporary sites", 2, "Council", 1, 0, "Schools bring a sense of normality, but housing and a point of contact for families come first at this stage."], ["Review rebuilding standards before repairs start", 1, "Council", 2, 0, "Rebuilding as before keeps the same weakness (Coppola). Reviewing standards before repairs start is cheap and stops the damage being repeated."]], "conseq": [{"item": 0, "title": "Five plans", "not_text": "Month 3. Five agencies are running their own recovery plans. Households have had four different letters. The council is blamed for the confusion.", "not_rp": -1, "yes_text": null, "yes_rp": 0}, {"item": 1, "title": "Passed from desk to desk", "not_text": "Month 3. About 200 families say they were passed between insurers, the council and builders. A support charity warns that some are close to breaking.", "not_rp": -1, "yes_text": null, "yes_rp": 0}, {"item": 2, "title": "Nowhere to live", "not_text": "Month 3. The rest centres have closed. About 300 households have no place to live and some are sleeping in cars.", "not_rp": -1, "yes_text": null, "yes_rp": 0}, {"item": 6, "title": "A broken promise", "not_text": "Month 4. The 'home in two weeks' promise is long broken. Families still in damaged homes are on the news. Fewer people come to community meetings.", "not_rp": -1, "yes_text": null, "yes_rp": 0}, {"item": 9, "title": "Rebuilt the weakness", "not_text": "Month 4. Repairs began fast, to the old standard. Some homes flooded again in a small storm. Residents say 'we rebuilt the same weakness'.", "not_rp": -1, "yes_text": null, "yes_rp": 0}, {"item": 7, "title": "The loan ends", "not_text": null, "not_rp": 0, "yes_text": "Month 3. The 30 staff on loan from neighbouring councils go home at the end of the month. You must decide who replaces them.", "yes_rp": 0}, {"item": 4, "title": "A repair group", "not_text": null, "not_rp": 0, "yes_text": "Month 3. Volunteers trained in Round 2 formed a local repair group. Its leader asks to join recovery meetings.", "yes_rp": 1}], "want": {"Council": "You want a recovery group chaired by the council, temporary housing, and staff borrowed from neighbouring councils. You want to show quick progress.", "British Red Cross": "You want one contact and a case worker for each flooded household, and honest information about how long recovery will take.", "Emergency services": "You want a plan for clearing debris with clear safety rules, and you want unsafe areas controlled so people do not enter unsafe homes."}, "resist": {"Council": "You will argue against slow reviews, such as checking rebuilding standards, that delay repairs and make the council look slow.", "British Red Cross": "You will argue against promises such as 'home in two weeks' that you know will be broken.", "Emergency services": "You will argue against volunteers and contractors working alone without safety rules."}, "injects": [{"id": "r4a", "has": [], "lacks": [6], "title": "The two-week promise", "time": "Day 7", "text": "A local politician has told the news that everyone will be back home within two weeks. The media asks: when will life be normal?", "cause": "Your team has not yet given a realistic timeline for recovery.", "change": {"6": {"must": true, "tag": "A promise that cannot be kept is already on the news."}, "2": {"tag": "Still essential. Most flooded homes will not be repaired in two weeks."}}, "add": [["Give an honest timeline in a joint statement, and say what you do not yet know", 1, "Council", 3, 1, "The pull to return to normal is the greatest obstacle in recovery. Honesty now avoids anger later when the promise breaks."], ["Meet the politician privately and agree one shared message", 1, "Council", 2, 1, "Politicians and agencies need to say the same thing."]], "model": "Say the truth about timelines, together, and agree one message."}, {"id": "r4b", "has": [6], "lacks": [7], "title": "Local capacity is hit", "time": "Day 7", "text": "Twenty council staff are flooded at home. Services that the recovery plan relies on are stalling.", "cause": "Your team has not yet asked neighbouring councils for help.", "change": {"7": {"must": true, "tag": "Services are stalling because staff are missing."}, "0": {"tag": "The group's work relies on staff who are currently not at work."}, "8": {"g": 0, "tag": "Not now: the council cannot manage this on top of its core services."}}, "add": [["Decide which council services must keep running and which can wait", 1, "Council", 3, 0, "With fewer staff, something has to give. Choosing deliberately is better than letting services fail at random."], ["Ask the Red Cross and voluntary groups to take on some tasks for now", 1, "British Red Cross", 2, 1, "Voluntary organisations can take on tasks while the council recovers its own capacity."]], "model": "Ask neighbouring councils for mutual aid and decide which services must keep running."}, {"id": "r4c", "has": [6, 7], "lacks": [], "title": "The possessions story", "time": "Day 7", "text": "A family says everything downstairs was thrown away, including items that could have been cleaned. A news crew is on their street.", "cause": "Your team has the timeline and staffing covered. Now household information is the problem.", "change": {"3": {"must": true, "tag": "Items are being thrown away before they can be listed for insurance.", "g": 3}, "1": {"tag": "Households need one place for guidance."}}, "add": [["Give households clear guidance on what to keep and how to photograph and list items for insurance", 1, "Joint", 3, 1, "Early, clear guidance protects households' insurance claims and their belongings."], ["Brief the debris contractors and volunteers on the same guidance", 1, "Council", 2, 1, "Guidance only works if the people doing the clearing follow it."], ["Say publicly that the early guidance was not clear enough, and put it right", 1, "Council", 2, 0, "Owning the failure openly rebuilds trust with affected households."]], "model": "Give households clear guidance, brief the clearers, and own the failure openly."}]}, {"n": 5, "name": "The recovery gap", "when": "Months 3 to 8", "phase": "Recovery and renewal", "minutes": 5, "brief": {"Council": "1,800 households are still out of their homes. Hotel funding ends in six weeks and it is winter. Government has offered a national fund, with bids due in eight weeks.", "British Red Cross": "You are seeing families who are stressed, in debt and isolated. They are tired of telling their story to each agency in turn.", "Emergency services": "The flood response is over. You hold the records of calls, rescues and reports from the first days. They show where the plan failed and who was missed."}, "situation": [["Month 3", "1,800 households are still out of their homes. Hotel funding ends in six weeks. It is winter."], ["Month 4", "300 small businesses closed after the flood. About 40 may not reopen. Insurance claims are being disputed and some households have had no reply for weeks."], ["Month 5", "Government offers a national recovery fund. Bids are due in eight weeks."], ["Month 6", "A local campaign wants the flood walls rebuilt exactly as before, and dredging. Other residents ask to be relocated. Winter storms are coming."]], "menu": [["Long-term housing plan: repair support and rent help for 1,800 households", 3, "Council", 2, 0, "A long-term housing plan answers the 1,800 households still out of their homes. It is costly, so it competes with other priorities."], ["Case management for every household until they are home", 2, "Joint", 3, 1, "Case management until households are home closes the gap between council arrangements and the private sector (Whittle et al.)."], ["Wellbeing and community support service", 2, "British Red Cross", 3, 0, "Stress is a normal reaction to abnormal events, and poorly managed recovery can cause more harm than the flood (Whittle et al.). Wellbeing support addresses this."], ["Business recovery grants", 2, "Council", 1, 0, "Business grants help, but at this stage households who are still displaced are the larger need."], ["Flood-resilient repair standards with funding (raised sockets, flood doors)", 2, "Council", 3, 0, "Flood-resilient repair uses the post-disaster window to build back better (Coppola), so the same homes are not flooded again."], ["Voluntary relocation option for the 400 worst-hit homes", 3, "Council", 2, 0, "A voluntary relocation offer for the worst-hit homes is a transformation, not just a bounce-back (Whittle et al.; Pitt: regeneration). It is costly and has to stay voluntary."], ["Joint bid for the national fund with a clear plan", 1, "Council", 2, 1, "A joint bid with a clear plan uses the policy window (Kingdon; Smith et al.). Funding goes to those who are ready."], ["Joint review with insurers and builders on claim delays", 1, "Joint", 2, 1, "Insurers and builders sit outside the Civil Contingencies Act, so a joint review is the practical way to deal with claim delays."], ["Ask residents' groups to help design the recovery plan", 1, "Joint", 2, 1, "Recovery works better when the people affected help shape it (Whittle et al., 2010). It also rebuilds trust that the response may have damaged."], ["Publish a simple public progress report every month", 1, "Council", 2, 1, "A simple monthly progress report keeps the timeline honest and rebuilds trust, at low cost."]], "conseq": [{"item": 0, "title": "Still in hotels", "not_text": "Month 7. Hotel funding has ended. About 600 households with no long-term plan are in unsuitable temporary housing."}, {"item": 2, "title": "At the end of their rope", "not_text": "Month 7. Referrals to GPs for stress and anxiety rise. Frontline staff say people are 'at the end of their rope'."}, {"item": 3, "title": "Empty high street", "not_text": "Month 7. Forty more businesses have closed. The high street has empty units and fewer customers."}, {"item": 6, "title": "The bid", "not_text": "Month 7. Your bid arrived incomplete and the fund went to a neighbouring city with a joint plan.", "yes_text": "Month 7. Your joint bid passed the first stage. The reviewers praised the clear plan and the partnership."}, {"item": 7, "title": "Waiting for insurers", "not_text": "Month 7. 300 households are still waiting for an insurance decision. The council keeps being blamed."}, {"item": 8, "title": "Done to, not with", "not_text": "Month 7. Residents say recovery is being done to them, not with them. Fewer people come to meetings."}, {"item": 9, "title": "Silence", "not_text": "Month 7. Rumours spread that recovery has been abandoned. The council is blamed for not saying what is happening."}], "want": {"Council": "You want a long-term housing plan and a joint bid for the national fund. You want repairs started quickly, because residents are angry about delays.", "British Red Cross": "You want a case worker for every household until they are home, and a wellbeing service. You want residents to help design the recovery plan.", "Emergency services": "You want your records used to learn what went wrong. You want a joint review with insurers and builders, and residents' groups involved in the plan."}, "resist": {"Council": "You will argue against paying for options that cost a lot and cannot help everyone, such as moving the worst-hit homes.", "British Red Cross": "You will argue against spending the money only on buildings and businesses while people's wellbeing is ignored.", "Emergency services": "You will argue against spending money on schemes that cannot show they will keep people safer in the next flood."}, "injects": [{"id": "r5a", "has": [], "lacks": [6], "title": "A policy window", "time": "Month 5", "text": "A minister visits and says money and political will exist for one big visible scheme if you can show a plan within a week.", "cause": "Your team has not yet started a joint bid for the national fund.", "change": {"6": {"must": true, "tag": "A plan is needed within a week."}, "4": {"tag": "A strong fit for a bid: it is visible and protects the worst-hit streets."}, "3": {"g": 0, "tag": "Not for this window: the minister wants one big scheme."}}, "add": [["Prepare a one-week outline plan and ask the minister's team what the bid must show", 1, "Council", 3, 1, "Policy windows open briefly when a problem, an idea and political pressure meet. A ready outline lets you use it instead of watching it close."], ["Ask residents' groups what they would want the money spent on", 1, "Joint", 2, 1, "A bid that reflects residents' priorities is stronger and more likely to be accepted."]], "model": "Have a ready plan and a joint bid so the policy window can be used, not just watched."}, {"id": "r5b", "has": [6], "lacks": [8], "title": "Petition", "time": "Month 5", "text": "A petition with 5,000 names asks for dredging only. The evidence says dredging alone will not protect the worst-hit streets.", "cause": "Your team has not yet involved residents' groups in designing the recovery plan."  temporary housing. The plan has not been updated.", "British Red Cross": "You know the communities. Many people who most need warnings are on no list: older people, people in temporary housing and people who do not speak English well.", "Emergency services": "Heavy rain is forecast in ten days. In the first flood, action waited for meetings. Next time your crews and officers will be first on the scene."}, "situation": [["Day 1", "The Environment Agency forecasts heavy rain in ten days. The river could again reach the level of the first flood."], ["Day 2", "About 30% of the north estate is not registered for flood warnings. Many households are now in temporary housing and are not on any list."], ["Day 4", "The first-flood review found that agencies waited for a meeting before acting. The flood plan has not been updated yet."], ["Day 6", "The repaired flood wall has one weak section. 1,100 households are still in the worst-hit streets."]], "menu": [["Update the flood plan with what you learned and share it with every agency", 2, "Joint", 3, 1, "Recovery and preparedness are one cycle (Fattoum, 2023). A plan that does not use what the first flood taught will be broken the same way."], ["Register every household, including those in temporary housing, for warnings, and test the system", 2, "Council", 3, 0, "People who are not on the list get no warning. Fixing the list is the cheapest way to protect the most vulnerable."], ["Run a short joint exercise with police, council and the British Red Cross", 1, "Joint", 2, 1, "An exercise tests roles and finds gaps before the storm does. It builds shared understanding, as Weick would describe it."], ["Agree trigger points: which warning level starts which action, with no meeting needed", 2, "Joint", 3, 1, "Triggers remove the delay of waiting for a meeting. This is the point of Fattoum (2023), Figure 4.2: act early on the forecast."], ["Brief care homes and sheltered housing and agree early evacuation", 1, "Council", 2, 0, "Care     if(S.timedOut[r.n])h+=`<div class="cq mid"><div class="k">Time ran out</div>This round was sent in when the time ended.</div>`;
    h+=`<div class="cq ${r.load==='ok'?'good':'bad'}"><div class="k">Workload</div>${r.count===0?'You made no decisions in this round.':r.load==='low'?'You chose '+r.count+' action'+(r.count>1?'s':'')+'. That left gaps: needs with nobody responsible, and agencies waiting for each other.':r.load==='high'?'You chose '+r.count+' actions. That is a lot to run at once. Teams, messages and volunteers get stretched and confused, and some actions are done badly. Your marks for priorities and co-ordination are reduced for this reason.':'You chose '+r.count+' actions, a workload your agencies could manage.'}</div>`;
    pk.forEach(i=>{const v=VERD[GR(r.n,i)];h+=`<div class="cq ${v[1]}"><div class="k">${v[0]} · led by ${esc(all[i][2])}</div><b>${esc(all[i][0])}</b><br>${esc(WHY(r.n,i))}</div>`});
    const missed=all.map((m,i)=>i).filter(i=>GR(r.n,i)>=2&&!pk.includes(i));
    if(missed.length){h+=`<h3 style="margin-top:14px">Priorities you did not choose</h3>`;missed.forEach(i=>{const after=missedAfter(r.n,i);h+=`<div class="cq bad"><div class="k">${GR(r.n,i)===3?'Strong choice missed':'Sound choice missed'}</div><b>${esc(all[i][0])}</b><br>${esc(WHY(r.n,i))}${after?`<br><i>What happened: ${esc(after)}</i>`:''}</div>`})}
    h+=`<h3 style="margin-top:14px">Co-ordination and your reasoning</h3><p>Co-ordinating actions chosen: <b>${r.coordHit.length}</b>. ${r.coordHit.length?'Good: '+r.coordHit.map(i=>esc(all[i][0])).join('; ')+'.':'None chosen. Actions such as '+r.coordIdx.slice(0,2).map(i=>esc(all[i][0])).join(' or ')+' bring agencies together.'}</p>
    <p><b>Your note:</b> ${esc(r.rs)||'<i>none written</i>'}</p><p class="hint">Not scored. Ask yourself whether your note links each choice to an idea from the session.</p>`;
    if(r.inj){const q=r.inj,ad=q.ad,nm_=k=>esc(all[k][0]);h+=`<div class="chaos"><div class="eyebrow">Update during this round: ${esc(q.title)} (${esc(q.time)}) · adapting ${f1(r.adapt)} of 2</div><p>${esc(q.text)}</p><p><b>Why your team got this:</b> ${esc(q.cause)}</p>
      <p><b>New or urgent options you took:</b> ${ad.took.length?ad.took.map(nm_).join('; '):'<i>none</i>'}.</p>
      <p><b>New or urgent options you did not take:</b> ${ad.missed.length?ad.missed.map(nm_).join('; '):'<i>none, you took them all</i>'}.</p>
      ${ad.stale.length?`<p><b>Choices the update made less useful:</b> you had selected ${ad.stale.map(nm_).join('; ')}. ${ad.dropped.length?'You removed: '+ad.dropped.map(nm_).join('; ')+'.':''} ${ad.kept.length?'You kept: '+ad.kept.map(nm_).join('; ')+'.':''}</p>`:''}
      <p><b>A strong response:</b> ${esc(q.model)}</p></div>`}else h+=`<div class="cq mid"><div class="k">Update missed</div>You submitted before the update arrived, so you could not adapt your choices. Adapting marks: 0.</div>`;
    h+=`</div>`});
  h+=`<div class="card"><h3>Epilogue: the second storm</h3>${epi().map(c=>`<div class="cq ${c.good?'good':'bad'}"><div class="k">${esc(c.title)}</div>${esc(c.text)}</div>`).join('')}</div>
  <div class="card"><div class="eyebrow">Your headline</div><p>${esc(S.headline)||'<span class="hint">None written.</span>'}</p></div>
  <div class="card noprint"><h3>Discussion</h3><ol>${DATA.DEBRIEF.map(q=>`<li>${esc(q)}</li>`).join('')}</ol></div>
  <div class="card noprint"><h3>Send your results</h3><p>Add the email addresses of your team members and your tutor, separated by commas. Your email app opens with the results ready to send.</p><label class="f" for="em">Email addresses</label><input type="text" id="em" data-f="emails" placeholder="name@example.com, name2@example.com" value="${esc(S.emails||'')}"><p class="row" style="margin-top:12px"><button class="btn" data-a="mail">Open email</button><button class="btn alt" data-a="copy">Copy results</button><button class="btn alt" data-a="dl">Download results</button></p><p class="hint" id="sendnote">If the email looks cut short, use Copy or Download and paste the results into your email.</p></div>
  <p class="noprint row"><button class="btn alt" onclick="window.print()">Print or save as PDF</button>${confirmReset?`<span>Start again and lose these answers?</span><button class="btn" data-a="reset2">Yes, start again</button><button class="btn alt" data-a="cancel">No</button>`:`<button class="btn alt" data-a="reset">Start again</button>`}</p></div>`;return h}
function resultsText(){const M=markAll();const L=[];
  L.push('OPERATION RISING WATER: results');L.push('Team: '+(S.team||'Team'));L.push('Roles: '+ROLE.map((r,i)=>r+(nm(i)?' - '+nm(i):'')).join('; '));L.push('Score: '+f1(M.got)+' out of '+M.max+' ('+M.pct+'%), '+M.band[0]);L.push('');
  M.rounds.forEach(r=>{const rd=R(r.n),all=menuAll(r.n);L.push('ROUND '+r.n+': '+rd.name+' (priorities '+f1(r.cover)+'/4, co-ordination '+r.coord+'/2, judgement '+f1(r.judge)+'/1, adapting '+f1(r.adapt)+'/2)');
    (S.picks[r.n]||[]).forEach(i=>L.push('- '+all[i][0]+' ['+VERD[GR(r.n,i)][0]+', '+all[i][2]+']'));
    L.push('Note: '+((S.reason[r.n]||'').trim()||'none written'));
    L.push(r.inj?'Update ('+r.inj.title+'): took '+r.inj.ad.took.length+' new or urgent options, missed '+r.inj.ad.missed.length+'.':'Update missed: submitted before it arrived.');L.push('')});
  L.push('Epilogue marks: '+M.ep+' out of '+DATA.EPILOGUE.length);L.push('Headline: '+((S.headline||'').trim()||'none written'));return L.join('\n')}
/* ---------- QR ---------- */
function makeQR(u){const q=qrcode(0,'M');q.addData(u);q.make();const n=q.getModuleCount(),cell=10,m=3,sz=(n+2*m)*cell;const cv=document.createElement('canvas');cv.width=cv.height=sz;const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,sz,sz);x.fillStyle='#000';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))x.fillRect((c+m)*cell,(r+m)*cell,cell,cell);return cv.toDataURL('image/png')}
/* ---------- control ---------- */
function render(){const a=$('#app');if(RV.open){a.innerHTML=vRole();window.scrollTo(0,0);return}a.innerHTML=S.stage==='intro'?vIntro():S.stage==='brief'?vBrief(S.round):S.stage==='play'?vPlay(S.round):S.stage==='epi'?vEpi():vSummary();window.scrollTo(0,0);if(S.stage==='play')tick()}
function submitRound(auto){const n=S.round;if(auto)S.timedOut[n]=true;if(n<NR){S.round=n+1;S.stage='brief'}else S.stage='epi';save();render()}
function reviewHTML(n){const j=INJ(n),pk=S.picks[n]||[],M0=R(n).menu.length,all=menuAll(n);if(!j)return '';
  const stale=pk.filter(i=>i<M0&&GR(n,i)<GR0(n,i)&&GR(n,i)<=1);
  const urgent=[];Object.keys(j.change).map(Number).forEach(i=>{if(j.change[i].must&&!pk.includes(i))urgent.push(i)});
  const newNone=j.add.every((m,k)=>!pk.includes(M0+k));
  if(!stale.length&&!urgent.length&&!newNone)return '';
  return '<div class="cq mid" style="margin-top:12px"><div class="k">Check before you submit</div>'+(stale.length?'<p style="margin:6px 0 0">Still selected, but the update made these less useful: <b>'+stale.map(i=>esc(all[i][0])).join('; ')+'</b>.</p>':'')+(urgent.length?'<p style="margin:6px 0 0">The update made these more urgent, and they are not selected: <b>'+urgent.map(i=>esc(all[i][0])).join('; ')+'</b>.</p>':'')+(newNone?'<p style="margin:6px 0 0">You have not selected any of the new options.</p>':'')+'<p class="row" style="margin:10px 0 0"><button class="btn alt" data-a="cancelsub">Go back and change</button><button class="btn" data-a="submit2">Submit as it is</button></p></div>'}
function tick(){if(S.stage!=='play')return;const n=S.round,left=tLeft(n);const el=$('#timer');if(el){el.textContent=tText(n);el.style.color=left<60000?'var(--bad)':''}const f=$('#tfill');if(f){f.style.width=(100*left/ROUND_MS)+'%';f.className=left<60000?'low':''}
  if(S.inject[n]==null&&ROUND_MS-left>=CHAOS_AT){const pk=(S.picks[n]||[]).slice();S.snap[n]=pk;S.inject[n]=injs(n).indexOf(injFor(n,pk));save();const b=$('#chaosbox');if(b){b.innerHTML=chaosHTML(n);const mb=$('#menubox');if(mb)mb.innerHTML=menuHTML(n);const nb=$('#newbox');if(nb)nb.innerHTML=newOptsHTML(n);const sm=$('#submsg');if(sm)sm.innerHTML='';b.scrollIntoView({block:'start',behavior:'smooth'})}}
  if(left<=0)submitRound(true)}
function meters(){const n=S.round,sp=(S.picks[n]||[]).length;const e=$('#sp');if(e)e.textContent=sp;const b=$('#sub');if(b)b.disabled=sp<1;document.querySelectorAll('.opt').forEach(o=>{const i=o.querySelector('input[type=checkbox]');if(i){o.classList.toggle('on',i.checked);}})}
document.addEventListener('input',e=>{const t=e.target,f=t.dataset.f;if(!f)return;const n=S.round;if(f==='headline')S.headline=t.value;else if(f==='emails')S.emails=t.value;else if(f==='name'){S.names[t.dataset.i]=t.value;checkStart()}else if(f==='team'){S.team=t.value;checkStart()}else if(f==='reason')S.reason[n]=t.value;else if(f==='chaos')S.chaos[n]=t.value;save()});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.pick==null)return;const n=S.round,i=+t.dataset.pick;let p=S.picks[n]||[];p=t.checked?[...new Set([...p,i])].sort((a,b)=>a-b):p.filter(x=>x!==i);S.picks[n]=p;save();meters()});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
 if(a==='start'){S.team=($('#tn').value||'').trim();if(!ready())return;S.stage='brief';S.round=1;save();render()}
 else if(a==='go'){const n=S.round;S.startedAt[n]=Date.now();S.stage='play';save();render()}
 else if(a==='submit'){const n=S.round,box=$('#submsg');const el=ROUND_MS-tLeft(n);if(S.inject[n]==null){const w=Math.max(0,Math.ceil((CHAOS_AT-el)/1000));box.innerHTML='<div class="cq mid" style="margin-top:12px"><div class="k">An update is on its way</div>New information arrives in about '+Math.floor(w/60)+':'+String(w%60).padStart(2,'0')+'. It will depend on what you have chosen, and it will change what you should do. If you submit now you will not see it, and you score 0 for adapting.<p class="row" style="margin:10px 0 0"><button class="btn alt" data-a="cancelsub">Wait for the update</button><button class="btn" data-a="submit2">Submit anyway</button></p></div>'}else{const w=reviewHTML(n);if(w)box.innerHTML=w;else submitRound(false)}}
 else if(a==='submit2'){submitRound(false)}else if(a==='cancelsub'){const bx=$('#submsg');if(bx)bx.innerHTML=''}
 else if(a==='finish'){S.stage='summary';save();render()}
 else if(a==='rv'){RV.role=+b.dataset.r;render()}else if(a==='rr'){RV.round=+b.dataset.r;render()}else if(a==='rhide'){RV.role=null;render()}else if(a==='ropen'){e.preventDefault();RV={open:true,fixed:false,role:null,round:S.stage==='intro'?1:S.round};render()}else if(a==='rback'){e.preventDefault();RV={open:false,fixed:false,role:null,round:1};try{if(location.hash.slice(1) in RH)history.replaceState(null,'',location.pathname+location.search)}catch(x){}render()}
 else if(a==='qr'){e.preventDefault();$('#qrbox').innerHTML=qrPanel()}
 else if(a==='qrmake'){const u=($('#qu').value||'').trim();const o=$('#qrout');if(!/^https?:\/\/\S+$/.test(u)){o.innerHTML='<p class="hint">Type or paste the full web address, starting with https://</p>';return}try{const base=u.split('#')[0];const one=(x,lab,f)=>'<div style="margin:12px 0"><div class="eyebrow">'+lab+'</div><img src="'+x+'" alt="QR code" style="width:200px;max-width:100%;image-rendering:pixelated;border:1px solid var(--line);margin:6px 0"><br><a class="btn alt" style="text-decoration:none;display:inline-block" download="'+f+'" href="'+x+'">Save image</a></div>';o.innerHTML=one(makeQR(base),'Team page (one device)','Rising Water QR team.png')+one(makeQR(base+'#emergency'),'Emergency services role card','Rising Water QR emergency services.png')+one(makeQR(base+'#council'),'Council role card','Rising Water QR council.png')+one(makeQR(base+'#redcross'),'British Red Cross role card','Rising Water QR british red cross.png')}catch(x){o.innerHTML='<p class="hint">That address is too long for a QR code.</p>'}}
 else if(a==='mail'){const to=($('#em').value||'').split(/[,;\s]+/).filter(x=>/@/.test(x));if(!to.length){$('#sendnote').textContent='Add at least one email address first.';return}location.href='mailto:'+to.join(',')+'?subject='+encodeURIComponent('Operation Rising Water results: '+(S.team||'Team'))+'&body='+encodeURIComponent(resultsText().slice(0,1500))}
 else if(a==='copy'){const tx=resultsText();const ok=()=>{$('#sendnote').textContent='Copied. Paste it into an email.'};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(tx).then(ok,()=>{$('#sendnote').textContent='Copy was blocked. Use Download instead.'});else $('#sendnote').textContent='Copy is not available here. Use Download instead.'}
 else if(a==='dl'){const bl=new Blob([resultsText()],{type:'text/plain'});const u=URL.createObjectURL(bl);const l=document.createElement('a');l.href=u;l.download='Rising Water results - '+(S.team||'Team').replace(/[^\w -]/g,'')+'.txt';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
 else if(a==='reset'){confirmReset=true;render()}else if(a==='cancel'){confirmReset=false;render()}
 else if(a==='reset2'){confirmReset=false;S=fresh();save();render()}});
window.addEventListener('hashchange',()=>{RV=rvFromHash();render()});
setInterval(tick,500);
render();


</script></body></html>
